[package]
name = "docxide-tools"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[[bin]]
name = "docx-inspect"
path = "src/bin/docx_inspect.rs"

[[bin]]
name = "docx-fonts"
path = "src/bin/docx_fonts.rs"

[[bin]]
name = "jaccard"
path = "src/bin/jaccard.rs"

[[bin]]
name = "case-diff"
path = "src/bin/case_diff.rs"

[[bin]]
name = "analyze-fixtures"
path = "src/bin/analyze_fixtures.rs"

[[bin]]
name = "case-browser"
path = "src/bin/case_browser.rs"

[[bin]]
name = "generate-shapes"
path = "src/bin/generate_shapes.rs"

[[bin]]
name = "shaping-compare"
path = "src/bin/shaping_compare.rs"

[[bin]]
name = "accept-baselines"
path = "src/bin/accept_baselines.rs"

[dependencies]
zip = "2"
roxmltree = "0.21"
image = "0.25"
eframe = "0.31"
egui_extras = { version = "0.31", features = ["image"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lopdf = "0.34"
rustybuzz = "0.20"
ttf-parser = "0.25"
memmap2 = "0.9"
