[package]
name = "docxide-pdf"
version = "0.18.4"
edition = "2024"
description = "Library and CLI for converting DOCX files to PDF, matching Microsoft Word's output as closely as possible"
license = "Apache-2.0"
repository = "https://github.com/sverrejb/docxide-pdf"
keywords = ["experimental", "docx", "pdf", "word", "converter"]
categories = ["command-line-utilities", "text-processing", "text-editors"]
include = ["src/**/*.rs", "Cargo.toml", "README.md", "LICENSE"]

[lib]
name = "docxide_pdf"
path = "src/lib.rs"

[[bin]]
name = "docxide-pdf"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = ["cli"]
cli = ["clap", "env_logger"]

[dependencies]
zip = "8.1.0"
roxmltree = "0.21"
pdf-writer = "0.14"
ttf-parser = "0.25"
log = "0.4"
clap = { version = "4", features = ["derive"], optional = true }
env_logger = { version = "0.11", optional = true }
memmap2 = "0.9.10"
subsetter = "0.2"
image = { version = "0.25", default-features = false, features = ["png", "bmp", "jpeg", "gif", "tiff"] }
png = "0.18"  # direct dep for fallback decoding of interlaced/partial PNGs
miniz_oxide = "0.8"
unicode-linebreak = "0.1.5"

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
env_logger = "0.11"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

# Optimize deps in dev/test builds — image processing is ~10× slower without this
[profile.dev.package."*"]
opt-level = 2

# The visual metrics live in tests/common, not in a dependency, so the override above does not
# reach them: unoptimized, SSIM over a 205-page fixture takes 117 CPU-s against 17 optimized.
# Costs ~2 s more on an incremental rebuild after a src/ edit.
[profile.test]
opt-level = 2
